<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Evaluation</title>
  <link rel="stylesheet" href="style.css">
  <script src="ai-evaluator.js" defer></script>
</head>
<body>
  <header>
    <h1>Weekly Evaluation</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="progress.html">Progress</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="evaluation-container">
      <h2>Track Your Weekly Stats</h2>
      <p>Enter your performance stats below to get personalized feedback on how to improve.</p>

      <div class="evaluation-form">
        <!-- Wide Receiver Section -->
        <div class="stat-section">
          <img src="https://via.placeholder.com/100" alt="Wide Receiver Icon" class="icon">
          <h3>Wide Receiver Stats</h3>
          <label for="receptions">Receptions:</label>
          <input type="number" id="receptions" name="receptions">
          <label for="yards">Yards:</label>
          <input type="number" id="yards" name="yards">
          <label for="tds">Touchdowns:</label>
          <input type="number" id="tds" name="tds">
        </div>

        <!-- Defensive Back Section -->
        <div class="stat-section">
          <img src="https://via.placeholder.com/100" alt="Defensive Back Icon" class="icon">
          <h3>Defensive Back Stats</h3>
          <label for="tackles">Tackles:</label>
          <input type="number" id="tackles" name="tackles">
          <label for="interceptions">Interceptions:</label>
          <input type="number" id="interceptions" name="interceptions">
          <label for="passBreakups">Pass Breakups:</label>
          <input type="number" id="passBreakups" name="passBreakups">
        </div>

        <button type="button" id="evaluate-button">Evaluate</button>
      </div>

      <div id="feedback" class="feedback-box"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Le Football. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('evaluate-button').addEventListener('click', () => {
      const stats = {
        receptions: parseInt(document.getElementById('receptions').value) || 0,
        yards: parseInt(document.getElementById('yards').value) || 0,
        tds: parseInt(document.getElementById('tds').value) || 0,
        tackles: parseInt(document.getElementById('tackles').value) || 0,
        interceptions: parseInt(document.getElementById('interceptions').value) || 0,
        passBreakups: parseInt(document.getElementById('passBreakups').value) || 0,
      };

      const feedback = evaluateStats(stats);
      document.getElementById('feedback').innerText = feedback;
    });
  </script>
</body>
</html>
